<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sagar R. Thalavar's portfolio: live projects, web experiments, and practical work across data, archives, and interactive systems."
    />
    <meta name="theme-color" content="#111111" />
    <meta property="og:title" content="Sagar R. Thalavar | Portfolio" />
    <meta
      property="og:description"
      content="Live projects, experimental interfaces, and practical work across data, archives, and web systems."
    />
    <meta property="og:type" content="website" />

    <meta name="apple-mobile-web-app-title" content="Sagar Portfolio" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: page renders immediately, fonts swap in when ready -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      />
    </noscript>

    <title>Sagar R. Thalavar | Portfolio</title>

    <!-- Favicon and App Icon Configuration -->
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="512x512" />
    
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Inlined from /init.js — eliminates separate network request & render-blocking -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved === 'dark' || saved === 'light' ? saved : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <style>
      :root {
        --bg: #f3f4f6;
        --bg-gradient: radial-gradient(circle at 10% 20%, rgba(243, 244, 246, 0.8) 0%, rgba(229, 231, 235, 0.3) 90%),
                       radial-gradient(circle at 90% 80%, rgba(219, 234, 254, 0.4) 0%, rgba(243, 244, 246, 0.8) 100%);
        --text-primary: #111827;
        --card-border: rgba(17, 24, 39, 0.07);
      }
      [data-theme='dark'] {
        --bg: #030712;
        --bg-gradient: radial-gradient(circle at 90% 10%, hsla(240, 25%, 11%, 0.9), hsla(240, 30%, 5%, 1)),
                       radial-gradient(circle at 10% 90%, hsla(240, 20%, 8%, 0.7), hsla(240, 30%, 5%, 1));
        --text-primary: #f9fafb;
        --card-border: rgba(255, 255, 255, 0.06);
      }
      body {
        margin: 0;
        background-color: var(--bg);
        background-image: var(--bg-gradient);
        background-attachment: fixed;
        min-height: 100vh;
      }
      .splash-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: var(--bg);
        background-image: var(--bg-gradient);
        background-attachment: fixed;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
      }
      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        text-align: center;
      }
      .splash-logo-container {
        position: relative;
        width: 100px;
        height: 100px;
      }
      .splash-svg {
        width: 100px;
        height: 100px;
        opacity: 0;
      }
      .splash-title-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .splash-title {
        margin: 0;
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text-primary);
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.25em;
        opacity: 0;
      }
      .splash-progressbar {
        width: 140px;
        height: 2px;
        background: var(--card-border);
        border-radius: 99px;
        overflow: hidden;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Preloaded Splash Screen to prevent visual flash before React hydrates -->
      <div class="splash-overlay" aria-hidden="true">
        <div class="splash-content">
          <div class="splash-logo-container">
            <svg class="splash-svg" viewBox="0 0 100 100" width="100" height="100">
              <path class="splash-path" d="M 32,48 C 38,35 44,65 50,50 C 56,35 62,65 68,52" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" fill="none" />
            </svg>
          </div>
          <div class="splash-title-container">
            <h2 class="splash-title">SAGAR R. THALAVAR</h2>
            <div class="splash-progressbar">
              <div class="splash-progressbar-fill"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
